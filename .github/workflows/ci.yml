name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Before the tests: the backend imports the database package's compiled output.
      - run: npm run build
      - run: npm test
      - name: The gate leaves the working tree clean
        run: test -z "$(git status --porcelain)"
